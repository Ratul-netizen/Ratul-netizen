<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Md. Wahid Sadiq Ratul — Red Team / Offensive Security Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="0.5" stop-color="#0a120c"/>
      <stop offset="1" stop-color="#050807"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#0f5132" stroke-opacity="0.22" stroke-width="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="1"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="2" y="2" width="896" height="246" rx="14"/></clipPath>
  </defs>

  <style>
    .name { font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; font-weight: 800; font-size: 52px; letter-spacing: 1px; }
    .sub  { font-family: ui-monospace, Consolas, monospace; font-size: 19px; letter-spacing: 2px; }
    .tag  { font-family: ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 3px; fill:#4ade80; opacity:.75; }
    .g1 { animation: g1 5.5s steps(1) infinite; }
    .g2 { animation: g2 5.5s steps(1) infinite; }
    .scan { animation: scan 4.5s linear infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    .swl { animation: swl 4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-10px); opacity:.0 } 10%{opacity:.5} 90%{opacity:.5} 100% { transform: translateY(250px); opacity:0 } }
    @keyframes swl { 0%,100% { transform: translateX(-60%) } 50% { transform: translateX(60%) } }
    @keyframes g1 {
      0%,90%,100% { clip-path: inset(0 0 101% 0); transform: translate(0,0) }
      91% { clip-path: inset(8% 0 78% 0);  transform: translate(-4px,0) }
      94% { clip-path: inset(44% 0 42% 0); transform: translate(5px,0) }
      97% { clip-path: inset(72% 0 12% 0); transform: translate(-3px,0) }
    }
    @keyframes g2 {
      0%,89%,100% { clip-path: inset(0 0 101% 0); transform: translate(0,0) }
      90% { clip-path: inset(20% 0 66% 0); transform: translate(4px,0) }
      93% { clip-path: inset(56% 0 30% 0); transform: translate(-5px,0) }
      96% { clip-path: inset(80% 0 6% 0);  transform: translate(3px,0) }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect x="2" y="2" width="896" height="246" rx="14" fill="url(#bg)"/>
    <rect x="2" y="2" width="896" height="246" fill="url(#grid)"/>

    <!-- moving scanline -->
    <rect class="scan" x="2" y="0" width="896" height="2.5" fill="#00ff41" opacity="0.4"/>

    <!-- top tag -->
    <text x="450" y="52" text-anchor="middle" class="tag">// ACCESS GRANTED &#183; ADVERSARY EMULATION &#183; MITRE ATT&amp;CK</text>

    <!-- name + glitch layers -->
    <g filter="url(#glow)">
      <text x="450" y="135" text-anchor="middle" class="name g2" fill="#00e5ff">Md. Wahid Sadiq Ratul</text>
      <text x="450" y="135" text-anchor="middle" class="name g1" fill="#ff2d9b">Md. Wahid Sadiq Ratul</text>
      <text x="450" y="135" text-anchor="middle" class="name" fill="#00ff41">Md. Wahid Sadiq Ratul</text>
    </g>

    <!-- animated underline -->
    <rect x="300" y="152" width="300" height="2" fill="#0f5132"/>
    <g clip-path="url(#underclip)">
      <rect class="swl" x="300" y="151.5" width="300" height="3" fill="url(#sweep)"/>
    </g>
    <clipPath id="underclip"><rect x="300" y="150" width="300" height="6"/></clipPath>

    <!-- subtitle -->
    <text x="450" y="192" text-anchor="middle" class="sub" fill="#c9f7d4">
      <tspan fill="#00ff41">&gt;</tspan> Red Team &#183; Offensive Security Engineer &#183; CPTS</text>
    <rect class="cur" x="700" y="178" width="10" height="17" fill="#00ff41"/>

    <!-- HUD corner brackets -->
    <g stroke="#00ff41" stroke-width="2.5" fill="none" opacity="0.85">
      <path d="M18 40 V18 H40"/>
      <path d="M882 40 V18 H860"/>
      <path d="M18 210 V232 H40"/>
      <path d="M882 210 V232 H860"/>
    </g>
    <rect x="2.5" y="2.5" width="895" height="245" rx="14" fill="none" stroke="#00ff41" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>
</svg>
