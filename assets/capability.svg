<text x="340" y="143" text-anchor="end" class="val">88%</text>
<rect x="40" y="150" width="300" height="9" rx="4.5" fill="#0d1a12" stroke="#13351f" stroke-width="1"/>
<rect class="b2" x="40" y="150" width="264.0" height="9" rx="4.5" fill="url(#fill)"/>
<text x="40" y="179" class="lbl">SIEM / Detection Engineering</text>
<text x="340" y="179" text-anchor="end" class="val">86%</text>
<rect x="40" y="186" width="300" height="9" rx="4.5" fill="#0d1a12" stroke="#13351f" stroke-width="1"/>
<rect class="b3" x="40" y="186" width="258.0" height="9" rx="4.5" fill="url(#fill)"/>
<text x="40" y="215" class="lbl">OSINT &amp; Threat Intelligence</text>
<text x="340" y="215" text-anchor="end" class="val">85%</text>
<rect x="40" y="222" width="300" height="9" rx="4.5" fill="#0d1a12" stroke="#13351f" stroke-width="1"/>
<rect class="b4" x="40" y="222" width="255.0" height="9" rx="4.5" fill="url(#fill)"/>
<text x="40" y="251" class="lbl">Automation · Python/Bash/PS</text>
<text x="340" y="251" text-anchor="end" class="val">88%</text>
<rect x="40" y="258" width="300" height="9" rx="4.5" fill="#0d1a12" stroke="#13351f" stroke-width="1"/>
<rect class="b5" x="40" y="258" width="264.0" height="9" rx="4.5" fill="url(#fill)"/>
<line x1="400" y1="70" x2="400" y2="286" stroke="#0f5132" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="440" y="72" width="195" height="94" rx="10" fill="#0a130d" stroke="#13351f" stroke-width="1.2"/>
<rect x="440" y="72" width="4" height="94" rx="2" fill="#00ff41"/>
<text x="541.5" y="120" text-anchor="middle" class="big" style="font-size:34px">~3</text>
<text x="541.5" y="146" text-anchor="middle" class="cap">YEARS</text>
<rect x="655" y="72" width="195" height="94" rx="10" fill="#0a130d" stroke="#13351f" stroke-width="1.2"/>
<rect x="655" y="72" width="4" height="94" rx="2" fill="#00ff41"/>
<text x="756.5" y="120" text-anchor="middle" class="big" style="font-size:34px">5</text>
<text x="756.5" y="146" text-anchor="middle" class="cap">ENGAGEMENTS</text>
<rect x="440" y="186" width="195" height="94" rx="10" fill="#0a130d" stroke="#13351f" stroke-width="1.2"/>
<rect x="440" y="186" width="4" height="94" rx="2" fill="#00ff41"/>
<text x="541.5" y="234" text-anchor="middle" class="big" style="font-size:26px">120+</text>
<text x="541.5" y="260" text-anchor="middle" class="cap">CRIT / HIGH</text>
<rect x="655" y="186" width="195" height="94" rx="10" fill="#0a130d" stroke="#13351f" stroke-width="1.2"/>
<rect x="655" y="186" width="4" height="94" rx="2" fill="#00ff41"/>
<text x="756.5" y="234" text-anchor="middle" class="big" style="font-size:26px">CPTS</text>
<text x="756.5" y="260" text-anchor="middle" class="cap">CERTIFIED</text>
<circle class="dot" cx="46" cy="296" r="4" fill="#00ff41"/>
<text x="58" y="300" class="st">SYSTEMS NOMINAL · MITRE ATT&amp;CK MAPPED · READY</text>
<rect class="shine" x="-120" y="2" width="120" height="306" fill="url(#shine)" opacity="0.08"/>
<rect x="2.5" y="2.5" width="895" height="305" rx="14" fill="none" stroke="#00ff41" stroke-opacity="0.4" stroke-width="1.2"/>
</g></svg>